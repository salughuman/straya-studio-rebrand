# Build must run on Netlify so postbuild injects dist/_redirects (301! shadows HTML).
[build]
  command = "npm run build"
  publish = "dist"

# Backup rule; primary redirect is dist/_redirects from scripts/inject-netlify-redirects.mjs
[[redirects]]
  from = "/*"
  to = "https://strayastudio.com/:splat"
  status = 301
  force = true
